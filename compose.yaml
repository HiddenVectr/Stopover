name: handoff
services:
  handoff:
    build: .
    image: handoff-local:0.3.1
    container_name: handoff
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - handoff_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  handoff_data:
