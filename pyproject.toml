[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-inbox"
version = "0.9.0"
description = "Baton: a shared MCP inbox for handing work and memory between AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3", "starlette>=0.48,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "anyio>=4.5,<5"]

[project.optional-dependencies]
testing = ["pytest>=8,<10"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2"]

[project.scripts]
baton = "baton.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baton = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
