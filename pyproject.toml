[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-local"
version = "0.3.1"
description = "A local MCP inbox for carrying work between AI agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3", "starlette>=0.48,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "anyio>=4.5,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2"]

[project.scripts]
handoff = "handoff.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handoff = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
