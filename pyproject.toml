[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stopover-mcp"
version = "0.16.0"
description = "Stopover: a shared MCP inbox for handing work and memory between AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<2", "pydantic>=2.11,<3", "starlette>=1.3.1,<2", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "anyio>=4.5,<5"]

authors = [{ name = "HiddenVectr" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "claude-code", "codex", "handoff", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/HiddenVectr/Stopover"
Documentation = "https://github.com/HiddenVectr/Stopover#more-information"
Issues = "https://github.com/HiddenVectr/Stopover/issues"
Changelog = "https://github.com/HiddenVectr/Stopover/blob/main/CHANGELOG.md"
Security = "https://github.com/HiddenVectr/Stopover/security/policy"

[project.optional-dependencies]
testing = ["pytest>=8,<10"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2"]

[project.scripts]
stopover = "stopover.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stopover = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
